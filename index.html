<!-- JSON-LD: FAQPage Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "What exactly is a Destination Management Company?", "acceptedAnswer": { "@type": "Answer", "text": "A DMC operates on the ground at the destination itself — vehicles, guides, hotel contracts, tickets and coordination. Most travel agents buy from a DMC and add a margin. With Direct Voyage you're dealing with the DMC directly, which is why the pricing works out better." } },
    { "@type": "Question", "name": "Do you sell fixed packages?", "acceptedAnswer": { "@type": "Answer", "text": "No. We publish sample plans as starting points, then rebuild them around your dates, budget, pace and preferences. Nothing is locked until you approve the final itinerary and price." } },
    { "@type": "Question", "name": "Are flights and visas included?", "acceptedAnswer": { "@type": "Answer", "text": "Our quotes are land packages by default — stays, transfers, sightseeing and experiences. We can add flights on request and we guide you through visa requirements and documentation for each destination." } },
    { "@type": "Question", "name": "What does \"no hidden costs\" really mean?", "acceptedAnswer": { "@type": "Answer", "text": "Your quotation is itemised line by line, with inclusions and exclusions written out clearly. There are no service charges added at check-out and no local \"extras\" collected by drivers or guides." } },
    { "@type": "Question", "name": "How do I pay, and what about cancellations?", "acceptedAnswer": { "@type": "Answer", "text": "Bookings are typically confirmed with an advance and settled before departure. Cancellation and refund terms depend on the hotels, cruise lines and airlines involved — they're stated in writing on your quotation before you pay anything." } },
    { "@type": "Question", "name": "What if something goes wrong during the trip?", "acceptedAnswer": { "@type": "Answer", "text": "You'll have a direct line to our on-ground coordinator for the destination throughout your travel window. Delayed flight, changed plan, a hotel issue — one message and we handle it, usually without extra cost." } },
    { "@type": "Question", "name": "Can you handle large groups or corporate trips?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Our own fleet makes group movement far easier to coordinate. We handle family reunions, friend groups, offsites and incentive trips, with a single coordinator managing the whole party." } },
    { "@type": "Question", "name": "How soon will I get my itinerary?", "acceptedAnswer": { "@type": "Answer", "text": "Most custom itineraries and quotes go out the same day, and complex multi-country or cruise plans within one working day." } }
  ]
}
</script>
